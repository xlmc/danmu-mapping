name: Convert MoviePilot words

# 定时把上游 MoviePilot 共享识别词转换为 danmu_api 映射表:
# 按 sources.txt 抓取上游(GitHub 目录页自动全抓/单文件直链)→ convert-moviepilot-words.mjs 转换
# → 有变化则提交 Word/2026.txt 与 season-candidates.txt → purge jsDelivr CDN 缓存
# 自定义词写在 Word/my-words.txt(MoviePilot 语法),存在时自动并入转换,不会被覆盖
on:
  schedule:
    - cron: '0 21 * * *' # 每天 UTC 21:00(北京时间 05:00)
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream words from sources.txt
        run: |
          mkdir -p upstream
          i=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | xargs)"
            case "$line" in ''|'#'*) continue;; esac
            i=$((i+1))
            if [[ "$line" =~ ^https://github\.com/([^/]+)/([^/]+)/tree/([^/]+)/(.+)$ ]]; then
              owner=${BASH_REMATCH[1]}; repo=${BASH_REMATCH[2]}; ref=${BASH_REMATCH[3]}; dir=${BASH_REMATCH[4]}
              echo "[dir] $owner/$repo@$ref/$dir"
              curl -fsSL "https://api.github.com/repos/$owner/$repo/contents/$dir?ref=$ref" \
                | jq -r '.[].download_url' \
                | while read -r u; do
                    name="$(echo "$dir" | tr '/' '_')_$(basename "$u")"
                    curl -fsSL -o "upstream/$name" "$u" && echo "downloaded $name"
                  done
            elif [[ "$line" =~ ^https://github\.com/([^/]+)/([^/]+)/blob/([^/]+)/(.+)$ ]]; then
              owner=${BASH_REMATCH[1]}; repo=${BASH_REMATCH[2]}; ref=${BASH_REMATCH[3]}; path=${BASH_REMATCH[4]}
              echo "[file] $owner/$repo@$ref/$path"
              curl -fsSL -o "upstream/src${i}_$(basename "$path")" \
                "https://raw.githubusercontent.com/$owner/$repo/$ref/$path" \
                && echo "downloaded src${i}_$(basename "$path")"
            else
              echo "[direct] $line"
              name="src${i}_$(basename "$line" | sed 's/[?#].*//')"
              curl -fsSL -o "upstream/$name" "$line" && echo "downloaded $name"
            fi
          done < sources.txt
          count=$(ls upstream/*.txt 2>/dev/null | wc -l)
          echo "total files: $count"
          [ "$count" -gt 0 ] || { echo "no upstream files downloaded, check sources.txt"; exit 1; }

      - name: Convert
        run: |
          args=(upstream/*.txt)
          if [ -f Word/my-words.txt ]; then
            args+=("Word/my-words.txt")
            echo "merging custom words: Word/my-words.txt"
          fi
          node convert-moviepilot-words.mjs "${args[@]}" --out Word

      - name: Commit if changed and purge CDN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Word/2026.txt Word/season-candidates.txt
          if git diff --cached --quiet; then
            echo "no changes, upstream not updated"
          else
            git commit -m "Auto-convert upstream words $(date -u +%F)"
            git push
            curl -fsS "https://purge.jsdelivr.net/gh/xlmc/danmu-mapping@main/Word/2026.txt" || true
            curl -fsS "https://purge.jsdelivr.net/gh/xlmc/danmu-mapping@main/Word/season-candidates.txt" || true
            echo "pushed and CDN purged"
          fi
