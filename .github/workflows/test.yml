name: Mapping regression tests
on:
  push:
    paths: ['*.mjs', 'tests/**', 'Source/source.txt', 'Word/auto-match-draft.txt', '.github/workflows/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
