name: Mapping regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/commit-hygiene.mjs --ci
      - run: node --test tests/*.test.mjs tools/*.test.mjs
